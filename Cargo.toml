[package]
name = "anglo-name-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "CLI to generate random Anglo names"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3"
